<!DOCTYPE html> 
<html lang="ja"> 
<head> 
    <meta charset="UTF-8"> 
    <title>【公式】リハビリ・エビデンス頻度計算機 | 論文AI解析ツール</title> 
    <meta name="description" content="全疾患対応。最新のリハビリ論文からAIが臨床ヒントを毎日自動更新。広告なし、登録不要。"> 
    <style> 
        body { font-family: sans-serif; background: #f8f9fa; color: #333; margin: 0; } 
        .container { max-width: 500px; margin: 20px auto; padding: 15px; } 
        .card { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); } 
        .update-tag { color: #27ae60; font-size: 11px; text-align: center; margin-bottom: 10px; } 
        select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; } 
        button { background: #2c3e50; color: #fff; font-weight: bold; border: none; cursor: pointer; } 
        #result { display: none; margin-top: 20px; padding: 15px; background: #f0f8ff; border-radius: 8px; border-left: 5px solid #2c3e50; } 
        .ofuse-area { background: #fff5f5; border: 2px solid #ffe3e3; padding: 20px; border-radius: 15px; text-align: center; margin-top: 30px; } 
        .ofuse-btn { background: #ff4757; color: #fff; text-decoration: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; display: inline-block; } 
        .disclaimer { font-size: 10px; color: #999; text-align: center; margin-top: 30px; line-height: 1.4; } 
    </style> 
</head> 
<body> 
<div　class="container"> 
     <div class="card"> 
         <div class="update-tag">● 本日の最新エビデンス解析済み</div> 
         <h2 style="text-align:center; font-size:18px;">リハビリ・エビデンス抽出</h2> 
         <select id="disease"> 
             <option value="stroke">脳卒中</option> 
             <option value="knee">変形性膝関節症</option> 
             <option value="back">腰痛</option> 
             <option value="cardio">心疾患</option> 
         </select> 
         <button onclick="search()">エビデンスを検索</button> 
         <div id="result"></div> 
     </div> 
     <div class="ofuse-area"> 
         <p style="font-size:13px; font-weight:bold;">🎁 ツール開発・維持を支援</p> 
         <p style="font-size:11px; color:#666; margin-bottom:15px;">広告なし・API無料維持のためにお布施をお願いします。</p> 
         <a href="https://ofuse.me/lamuchan" class="ofuse-btn">OFUSEで応援する</a> 
     </div> 
     
     <divclass="disclaimer"> 
         【免責事項】本ツールは論文タイトルの自動解析結果であり、医学的アドバイスではありません。個別の判断は主治医に相談してください。(自動更新システム稼働中) 
     </div> 
</div> 
<script> 
function search() { 
    const res = document.getElementById('result'); 
    res.style.display = 'block'; 
    res.innerHTML = "解析中..."; 
    fetch('./papers.json').then(r => r.json()).then(data => { 
        const d = document.getElementById('disease').value; 
        const items = data.diseases[d] || []; 
        let html = "<strong>解析結果:</strong><br>"; 
        items.forEach(i => { 
            html += `<div style="margin-top:10px;">・<a href="${i.url}" target="_blank">${i.title}</a><br><smallstyle="color:#d35400;">💡 ${i.hint}</small></div>`; 
        }); 
        res.innerHTML = html; 
    }); 
} 
</script> 
</body> 
</html>
